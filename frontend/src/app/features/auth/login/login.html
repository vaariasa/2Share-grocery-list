<main class="auth-page">
  <form class="card auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Grocery List</h1>
    <p class="subtitle">Log in to see your grocery list.</p>

    @if (justRegistered) {
      <p class="message success">Your account was created. You can log in now.</p>
    }

    <label class="field">
      <span>Username</span>
      <input formControlName="username" autocomplete="username" />
      @if (form.controls.username.touched && form.controls.username.invalid) {
        <small class="field-error">Username is required.</small>
      }
    </label>

    <label class="field">
      <span>Password</span>
      <input formControlName="password" type="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="field-error">Password is required.</small>
      }
    </label>

    @if (errorMessage()) {
      <p class="message error">{{ errorMessage() }}</p>
    }

    <button class="btn btn-primary" type="submit" [disabled]="isSubmitting()">Log in</button>

    <p class="switch">No account yet? <a routerLink="/register">Register</a></p>
  </form>
</main>
