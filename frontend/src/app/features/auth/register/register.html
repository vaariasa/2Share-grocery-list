<main class="auth-page">
  <form class="card auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Create an account</h1>
    <p class="subtitle">Register to start your grocery list.</p>

    <label class="field">
      <span>Username</span>
      <input formControlName="username" autocomplete="username" maxlength="50" />
      @if (form.controls.username.touched && form.controls.username.invalid) {
        <small class="field-error">Username is required (max. 50 characters).</small>
      }
    </label>

    <label class="field">
      <span>Full name</span>
      <input formControlName="fullName" autocomplete="name" maxlength="100" />
      @if (form.controls.fullName.touched && form.controls.fullName.invalid) {
        <small class="field-error">Full name is required (max. 100 characters).</small>
      }
    </label>

    <label class="field">
      <span>Password</span>
      <input formControlName="password" type="password" autocomplete="new-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="field-error">Password must be at least 6 characters.</small>
      }
    </label>

    @if (errorMessage()) {
      <p class="message error">{{ errorMessage() }}</p>
    }

    <button class="btn btn-primary" type="submit" [disabled]="form.invalid || isSubmitting()">Register</button>

    <p class="switch">Already have an account? <a routerLink="/login">Log in</a></p>
  </form>
</main>
